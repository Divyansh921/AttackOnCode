<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Attack on Code</title>
  <meta name="description" content="Create your Attack on Code account and join the builder community.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-card { max-width: 480px; }
    .name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .password-req {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .password-req i { font-size: 14px; }
    .terms {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .terms a { color: var(--red); font-weight: 500; }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="nav">
    <div class="nav-inner">
      <div class="nav-left">
        <a href="index.html" class="nav-logo">
          <div class="nav-logo-icon"><i class="ti ti-code"></i></div>
          <span class="nav-logo-text">Attack on Code</span>
        </a>
      </div>
      <div class="nav-right">
        <a href="login.html" class="btn btn-ghost">Log in</a>
      </div>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon"><i class="ti ti-code"></i></div>
        <span class="auth-logo-text">Attack on Code</span>
      </div>

      <h2 class="auth-title">Create your account</h2>
      <p class="auth-subtitle">Join 1,240+ builders forming teams and shipping projects.</p>

      <button class="social-btn" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continue with Google
      </button>
      <button class="social-btn" type="button">
        <i class="ti ti-brand-github" style="font-size:20px;"></i>
        Continue with GitHub
      </button>

      <div class="divider">or with email</div>

      <form id="register-form">
        <div class="name-row">
          <div class="form-group">
            <label class="form-label" for="reg-first">First name</label>
            <input class="form-input" type="text" id="reg-first" placeholder="Aryan" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-last">Last name</label>
            <input class="form-input" type="text" id="reg-last" placeholder="Sharma" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-email">Email</label>
          <input class="form-input" type="email" id="reg-email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <input class="form-input" type="password" id="reg-password" placeholder="Create a strong password" required>
          <div class="password-req"><i class="ti ti-info-circle"></i> Minimum 8 characters with a number and symbol</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-confirm">Confirm password</label>
          <input class="form-input" type="password" id="reg-confirm" placeholder="Confirm your password" required>
        </div>
        <div class="terms">
          By creating an account, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-full"><i class="ti ti-rocket"></i> Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Log in</a>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
