<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Attack on Code</title>
  <meta name="description" content="Reset your Attack on Code password.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    .success-state { display: none; text-align: center; }
    .success-state.show { display: block; }
    .success-icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: var(--green-light); color: var(--green);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; margin: 0 auto 20px;
    }
    .form-state { display: block; }
    .form-state.hide { display: none; }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="nav">
    <div class="nav-inner">
      <div class="nav-left">
        <a href="index.html" class="nav-logo">
          <div class="nav-logo-icon"><i class="ti ti-code"></i></div>
          <span class="nav-logo-text">Attack on Code</span>
        </a>
      </div>
      <div class="nav-right">
        <a href="login.html" class="btn btn-ghost">Back to Login</a>
      </div>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon"><i class="ti ti-code"></i></div>
        <span class="auth-logo-text">Attack on Code</span>
      </div>

      <!-- Form State -->
      <div class="form-state" id="forgot-form-state">
        <h2 class="auth-title">Forgot password?</h2>
        <p class="auth-subtitle">Enter your email and we'll send you a link to reset your password.</p>

        <form id="forgot-form">
          <div class="form-group">
            <label class="form-label" for="forgot-email">Email address</label>
            <input class="form-input" type="email" id="forgot-email" placeholder="you@example.com" required>
          </div>
          <button type="submit" class="btn btn-primary btn-lg btn-full"><i class="ti ti-mail"></i> Send Reset Link</button>
        </form>

        <div class="auth-footer">
          Remember your password? <a href="login.html">Log in</a>
        </div>
      </div>

      <!-- Success State -->
      <div class="success-state" id="forgot-success-state">
        <div class="success-icon"><i class="ti ti-check"></i></div>
        <h2 class="auth-title">Check your email</h2>
        <p class="auth-subtitle">We've sent a password reset link to your email address. The link will expire in 24 hours.</p>
        <a href="login.html" class="btn btn-outline btn-lg btn-full" style="margin-top:24px;"><i class="ti ti-arrow-left"></i> Back to Login</a>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('forgot-form-state').classList.add('hide');
      document.getElementById('forgot-success-state').classList.add('show');
    });
  </script>
</body>
</html>
